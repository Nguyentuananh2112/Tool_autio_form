# Phát hành: đẩy tag vX.Y.Z → kiểm thử → build bộ cài Windows → đăng GitHub Release.
# App đã cài đọc latest.yml trong Release để hiện "Có bản cập nhật" (desktop/src/updater.ts).
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Kiểm tra tag khớp phiên bản trong desktop/package.json
        shell: bash
        run: |
          VERSION=$(node -p "require('./desktop/package.json').version")
          if [ "v$VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} không khớp phiên bản v$VERSION trong desktop/package.json"; exit 1
          fi

      - name: Lấy ghi chú phát hành từ CHANGELOG.md
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 {found=1; next}
            found && /^## / {exit}
            found {print}
          ' CHANGELOG.md > desktop/release-notes.md
          if [ ! -s desktop/release-notes.md ]; then echo "CHANGELOG.md chưa có mục cho $VERSION"; exit 1; fi
          cat desktop/release-notes.md

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Kiểm thử & đóng gói backend
        working-directory: backend
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python -m pip install -r requirements-dev.txt -r requirements-build.txt
          python -m pytest -q
          python packaging/build_backend.py

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build giao diện
        working-directory: frontend
        run: |
          npm ci
          npx vitest run
          npx vite build

      - name: Build bộ cài & đăng GitHub Release
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm ci
          npm run build
          npx electron-builder --win --publish always -c.releaseInfo.releaseNotesFile=release-notes.md
