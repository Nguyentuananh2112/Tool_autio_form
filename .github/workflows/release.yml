# Phát hành: đẩy tag vX.Y.Z → kiểm thử → build bộ cài Windows → đăng GitHub Release.
# App đã cài đọc latest.yml trong Release để hiện "Có bản cập nhật" (desktop/src/updater.ts).
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Kiểm tra tag khớp phiên bản trong desktop/package.json
        shell: bash
        run: |
          VERSION=$(node -p "require('./desktop/package.json').version")
          if [ "v$VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} không khớp phiên bản v$VERSION trong desktop/package.json"; exit 1
          fi

      - name: Lấy ghi chú phát hành từ CHANGELOG.md
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 {found=1; next}
            found && /^## / {exit}
            found {print}
          ' CHANGELOG.md > desktop/release-notes.md
          if [ ! -s desktop/release-notes.md ]; then echo "CHANGELOG.md chưa có mục cho $VERSION"; exit 1; fi
          cat desktop/release-notes.md

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Kiểm thử backend
        working-directory: backend
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python -m pip install -r requirements-dev.txt -r requirements-build.txt
          python -m pytest -q

      # Tách bước: key Gemini chỉ có mặt lúc đóng gói, không lộ cho bước chạy test (SPEC-020)
      - name: Nhúng key Gemini chung (GitHub Secrets) rồi đóng gói backend
        working-directory: backend
        env:
          PYTHONIOENCODING: utf-8
          GEMINI_SHARED_KEY: ${{ secrets.GEMINI_SHARED_KEY }}
          GEMINI_BACKUP_KEY: ${{ secrets.GEMINI_BACKUP_KEY }}
        run: |
          python packaging/write_build_secrets.py
          python packaging/build_backend.py

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build giao diện
        working-directory: frontend
        run: |
          npm ci
          npx vitest run
          npx vite build

      # Tạo sẵn Release nháp: electron-builder tải các file song song, nếu chưa có Release
      # nó tạo trùng 2 bản cùng tag (BUG-021). Có sẵn bản nháp thì mọi file vào cùng một chỗ.
      - name: Tạo sẵn Release nháp
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --draft --title "${GITHUB_REF_NAME#v}" --notes-file desktop/release-notes.md

      - name: Build bộ cài & tải lên Release nháp
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm ci
          npm run build
          npx electron-builder --win --publish always --config.releaseInfo.releaseNotesFile=release-notes.md

      - name: Công khai Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name'
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
